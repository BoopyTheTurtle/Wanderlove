name: Purge expired photos

# Deletes the photos of trails that ended more than a month ago, files and rows alike
# (scripts/purge-expired-photos.mjs; migration 20260930120000_photo_retention.sql).
# Needs the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets, and fails until both exist.
# GitHub runs scheduled workflows from the default branch only.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Count expired photos without deleting anything
        type: boolean
        default: false

concurrency:
  group: purge-photos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Purge
        run: node scripts/purge-expired-photos.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
